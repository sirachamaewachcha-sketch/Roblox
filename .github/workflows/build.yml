
name: Build LuaPad32 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -o LuaPad32_Project_with_build.zip -d extracted
          echo "Project files:"
          find extracted -maxdepth 3 -type f | head -80

      - name: Locate Gradle project
        run: |
          find . -name gradlew -type f
          find . -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          cd extracted
          PROJECT_DIR="$(find . -name gradlew -type f -printf '%h\n' | head -1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew not found in extracted ZIP"
            exit 1
          fi
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuaPad32-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
