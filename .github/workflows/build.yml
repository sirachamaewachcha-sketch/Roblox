
name: Build LuaPad32 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project ZIP
        run: |
          unzip -o LuaPad32_Project_with_build.zip -d extracted
          echo "Searching for Gradle project..."
          find extracted \( -name settings.gradle -o -name settings.gradle.kts \) -type f

      - name: Build APK
        run: |
          SETTINGS="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)"
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuaPad32-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
