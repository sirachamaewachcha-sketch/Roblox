name: Build LuaPad32 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project ZIP
        run: |
          unzip -o LuaPad32_Project_with_build.zip -d extracted

      - name: Replace settings.gradle
        run: |
          SETTINGS=$(find . -maxdepth 2 -name settings.gradle -type f | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found in repository root"
            exit 1
          fi
          TARGET=$(find extracted -name settings.gradle -type f | head -1)
          if [ -z "$TARGET" ]; then
            echo "ERROR: settings.gradle not found in ZIP"
            exit 1
          fi
          cp "$SETTINGS" "$TARGET"
          echo "Replaced: $TARGET"

      - name: Build APK
        run: |
          SETTINGS=$(find extracted -name settings.gradle -type f | head -1)
          cd "$(dirname "$SETTINGS")"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuaPad32-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error